plugins {
    id 'com.android.application'
}

def git = { List<String> cmd, String fallback ->
    try {
        return providers.exec { commandLine cmd }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return fallback
    }
}
// Название версии — 1.0.<число коммитов>, для людей.
def commitCount = git(['git', 'rev-list', '--count', 'HEAD'], '1').toInteger()
// Код версии растёт со временем коммита (минуты с 1 января 2026 + 1000), а не с числом коммитов:
// так сборка из любой ветки или после слияния не окажется «старее» уже установленной,
// и обновление ставится поверх, не стирая сохранения.
def commitTime = git(['git', 'log', '-1', '--format=%ct'], '1767225600').toLong()
def code = (int) ((commitTime - 1767225600L).intdiv(60L)) + 1000

android {
    namespace 'io.github.pozornyk3000.anamnez'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.pozornyk3000.anamnez'
        minSdk 24
        targetSdk 35
        versionCode code
        versionName "1.0.${commitCount}"
    }

    // Ключ лежит в репозитории намеренно: так любая сборка (локальная или в GitHub Actions)
    // подписана одинаково и обновление ставится поверх, не стирая сохранения.
    // Для публикации в магазине приложений замените его своим и уберите пароли отсюда.
    signingConfigs {
        release {
            storeFile rootProject.file('keystore/anamnez.jks')
            storePassword 'anamnez-game'
            keyAlias 'anamnez'
            keyPassword 'anamnez-game'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Игра (HTML, шрифты, иконки) собирается отдельно: node tools/build.mjs --site android/app/src/main/assets/www
tasks.named('preBuild') {
    doFirst {
        if (!file('src/main/assets/www/index.html').exists()) {
            throw new GradleException('Нет src/main/assets/www/index.html. Сначала выполните из корня репозитория: node tools/build.mjs --site android/app/src/main/assets/www')
        }
    }
}
